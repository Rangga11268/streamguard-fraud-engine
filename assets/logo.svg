<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Shield Outline Gradient -->
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wave Stream Pattern -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="512" height="512" rx="96" fill="url(#shieldBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Silhouette (Outer Protective Perimeter) -->
  <path d="M 256 64 L 400 120 C 400 270, 340 376, 256 448 C 172 376, 112 270, 112 120 Z" 
        fill="#090d16" stroke="url(#shieldEdge)" stroke-width="6" />

  <!-- Sliding-Window Streaming Radar Waves (Real-Time Ingestion) -->
  <path d="M 148 180 Q 256 220 364 180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 160 230 Q 256 270 352 230" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 180 280 Q 256 320 332 280" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Dual-Memory Delayed Feedback Ring (Fast vs Delayed Settlement Nodes) -->
  <circle cx="210" cy="250" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="302" cy="250" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />
  <line x1="224" y1="250" x2="288" y2="250" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Central Verification Decision Check (Zero-Loss Fraud Approval) -->
  <path d="M 230 350 L 250 370 L 290 324" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pulse Status Nodes -->
  <circle cx="256" cy="116" r="6" fill="#10b981" />
  <circle cx="256" cy="116" r="12" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />
</svg>
